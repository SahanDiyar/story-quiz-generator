<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story & Question Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        h1 { margin-top: 0; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        textarea, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #5c6bc0; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; }
        button:hover { background-color: #3f51b5; }
        #outputSection { margin-top: 25px; display: none; }
        pre { background: #263238; color: #80cbc4; padding: 15px; border-radius: 4px; overflow-x: auto; max-height: 300px; }
        .download-btn { display: inline-block; background-color: #2e7d32; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; margin-top: 10px; font-weight: bold; }
        .download-btn:hover { background-color: #1b5e20; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Story & Question Generator</h1>
        <p>Enter your story and the number of questions to generate your export file for Yad's app.</p>

        <label for="storyText">Story</label>
        <textarea id="storyText" rows="6" placeholder="Paste your story here..."></textarea>

        <label for="numQuestions">Number of Questions</label>
        <input type="number" id="numQuestions" value="5" min="1" max="20">

        <button onclick="generateFile()">Generate File</button>

        <div id="outputSection">
            <h3>Your file is ready:</h3>
            <a id="downloadLink" class="download-btn" download="story_data.js">Download story_data.js</a>
            <p>Preview:</p>
            <pre id="jsonPreview"></pre>
        </div>
    </div>

    <script>
        async function generateFile() {
            const text = document.getElementById('storyText').value;
            const numQuestions = document.getElementById('numQuestions').value;
            const outputSection = document.getElementById('outputSection');
            const jsonPreview = document.getElementById('jsonPreview');
            const downloadLink = document.getElementById('downloadLink');

            if (!text) {
                alert('Please enter a story first!');
                return;
            }

            outputSection.style.display = 'block';
            jsonPreview.innerText = 'Generating file with AI, please wait...';

            try {
                const response = await fetch('/api/generate-story-quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, numQuestions })
                });

                const data = await response.json();

                if (data.error) {
                    jsonPreview.innerText = `Error: ${data.error}`;
                    return;
                }

                const jsonString = JSON.stringify(data, null, 2);
                const fileContent = `export default ${jsonString};`;
                
                jsonPreview.innerText = fileContent;

                const blob = new Blob([fileContent], { type: 'application/javascript' });
                const fileUrl = URL.createObjectURL(blob);
                downloadLink.href = fileUrl;

            } catch (err) {
                jsonPreview.innerText = 'Failed to connect to the backend server.';
            }
        }
    </script>
</body>
</html>
